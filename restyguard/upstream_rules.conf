# 🚀 RestyGuard 静态路由配置文件
# 本文件用于配置 SNI 域名到上游主机的转发路由。
#
# 💡 配置规则：
# 1. 采用标准的 "域名=目标主机:目标端口" 的 Key-Value 格式，一行一个域名映射，极为清爽。
# 2. 支持使用 '#' 进行行首注释。
# 3. 支持使用 '*' 作为默认兜底路由。
#
# ----------------- 示例配置 -----------------
# git.mycorp.com=192.168.1.10:443
# api.mycorp.com=api-server:8443
# *=translate.googleapis.com:443
# --------------------------------------------

*=translate.googleapis.com:443
