name: Docker 构建和发布 (Premium)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制构建（忽略版本检查）"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: restyguard
            context: ./restyguard
            image: resty-guard
          - name: restytunnel
            context: ./restytunnel
            image: resty-tunnel

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 获取最新版本
        id: fetch-version
        run: |
          # 1. 自动从官方 openresty 仓库拉取 1.31 系列的 alpine 相关 tag 列表
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/openresty/openresty/tags?page_size=100")
          if [ -z "$RESPONSE" ] || [ "$(echo "$RESPONSE" | jq -r '.results' 2>/dev/null)" = "null" ]; then
            echo "❌ 错误: 无法从 Docker Hub 获取官方 OpenResty 版本信息"
            exit 1
          fi

          # 2. 筛选出标准的 1.31 系列 alpine 镜像标签（例如 1.31.1.1-1-alpine）
          LATEST_TAG=$(echo "$RESPONSE" | jq -r '.results[].name' | grep -E '^1\.31\.[0-9.]+\-[0-9]+\-alpine$' | head -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ 错误: 未能在官方源中匹配到合规的 1.31 Alpine 标签"
            exit 1
          fi

          # 3. 提取出具体的子版本号（例如从 1.31.1.1-1-alpine 提取出 1.31.1.1-1）
          LATEST_VERSION=$(echo "$LATEST_TAG" | sed 's/-alpine//')
          CURRENT_VERSION=$(cat version 2>/dev/null || echo "0.0.0")

          # 4. 动态提取出大版本号（例如从 1.31.1.1-1 提取出前两位的 1.31）
          MAJOR_VERSION=$(echo "$LATEST_VERSION" | cut -d. -f1,2)

          echo "官方最新底层 OpenResty 1.31 子版本: $LATEST_VERSION"
          echo "动态解析出的大版本号: $MAJOR_VERSION"
          echo "我们当前构建过的历史版本: $CURRENT_VERSION"

          # 传递大版本号给后续步骤
          echo "major_version=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

          # 手动触发时支持强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "检测到手动触发-强制构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "检测到代码提交，触发自动构建以同步最新代码"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          elif [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "官方底层版本未发生更新，且无新代码提交，跳过本次构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "发现官方 OpenResty 底层发布了新补丁版本: $LATEST_VERSION"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 构建并推送 Docker 镜像 (Premium)
        if: steps.fetch-version.outputs.skip_build == 'false'
        run: |
          LATEST_VERSION=${{ steps.fetch-version.outputs.latest_version }}
          MAJOR_VERSION=${{ steps.fetch-version.outputs.major_version }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}"

          echo "构建多架构镜像: linux/amd64, linux/arm64"
          echo "标签: latest, ${MAJOR_VERSION}, ${LATEST_VERSION}, ${LATEST_VERSION}-${TIMESTAMP}"

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${REPO}:latest \
            -t ${REPO}:${MAJOR_VERSION} \
            -t ${REPO}:${LATEST_VERSION} \
            -t ${REPO}:${LATEST_VERSION}-${TIMESTAMP} \
            --push ${{ matrix.context }}

      - name: 更新仓库文件 (Version & Time)
        if: steps.fetch-version.outputs.skip_build == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          LATEST_VERSION=${{ steps.fetch-version.outputs.latest_version }}

          # 在全局根目录下保留唯一的 version 文件
          echo "$LATEST_VERSION" > version
          git add version

          # 全局根目录下的 time 物理时间戳文件
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          echo "$current_time" > time
          git add time

          # 采用 pull --rebase 极效化规避多 matrix 并行推送冲突，确保完美入库
          git commit -m "chore: [${{ matrix.name }}] 镜像版本更新为 $LATEST_VERSION - 北京时间: $current_time" || echo "没有变更"
          git pull --rebase origin main
          git push origin main
