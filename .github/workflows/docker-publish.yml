name: Docker 构建和发布 (Premium)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制构建（忽略版本检查）"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: restyguard
            context: ./restyguard
            image: resty-guard
          - name: restytunnel
            context: ./restytunnel
            image: resty-tunnel

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 获取最新版本
        id: fetch-version
        run: |
          # 从上游 Docker Hub 获取当前镜像的最新 tag 版本
          # 动态拼接用户真实的 DOCKERHUB_USERNAME
          FULL_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}"
          RESPONSE=$(wget -qO- "https://hub.docker.com/v2/repositories/${FULL_IMAGE}/tags" 2>/dev/null || echo "")
          if [ -z "$RESPONSE" ]; then
            echo "警告: 无法从 Docker Hub 获取版本信息"
          fi

          LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.results[] | select(.name != "latest" and (.name | test("cache|rc|beta|alpha") | not)) | .name' | head -n1)
          CURRENT_VERSION=$(cat version 2>/dev/null || echo "1.0.0")

          # 如果线上还没有发布过任何 tag，默认设为当前本地版本
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            LATEST_VERSION="$CURRENT_VERSION"
          fi

          echo "当前版本: $CURRENT_VERSION"
          echo "最新线上版本: $LATEST_VERSION"

          # 手动触发时支持强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "检测到手动触发-强制构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "检测到代码提交，自动触发构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          elif [ "$LATEST_VERSION" = "$CURRENT_VERSION" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时触发：版本无变化，跳过构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "版本有变化或属于首次构建，开始执行构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 构建并推送 Docker 镜像 (Premium)
        if: steps.fetch-version.outputs.skip_build == 'false'
        run: |
          LATEST_VERSION=${{ steps.fetch-version.outputs.latest_version }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}"

          echo "构建多架构镜像: linux/amd64, linux/arm64"
          echo "标签: latest, ${LATEST_VERSION}, ${LATEST_VERSION}-${TIMESTAMP}"

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${REPO}:latest \
            -t ${REPO}:${LATEST_VERSION} \
            -t ${REPO}:${LATEST_VERSION}-${TIMESTAMP} \
            --push ${{ matrix.context }}

      - name: 更新仓库文件 (Version & Time)
        if: steps.fetch-version.outputs.skip_build == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          LATEST_VERSION=${{ steps.fetch-version.outputs.latest_version }}

          # 在全局根目录下保留唯一的 version 文件
          echo "$LATEST_VERSION" > version
          git add version

          # 全局根目录下的 time 物理时间戳文件
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          echo "$current_time" > time
          git add time

          # 采用 pull --rebase 极效化规避多 matrix 并行推送冲突，确保完美入库
          git commit -m "chore: [${{ matrix.name }}] 镜像版本更新为 $LATEST_VERSION - 北京时间: $current_time" || echo "没有变更"
          git pull --rebase origin main
          git push origin main
