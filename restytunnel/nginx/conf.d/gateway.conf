# 统一入口：安全过滤与代理检测分流 (Security & Proxy Gateway)
location / {
    access_by_lua_block {
        local headers = ngx.req.get_headers()
        local proxy_auth = headers["Proxy-Authorization"]
        local method = ngx.req.get_method()

        -- 🚀 [极致性能优化] 引入 config 高速缓存字典，彻底消除每请求 getenv 与 base64 编解码损耗，将鉴权 CPU 消耗压至极小值！
        local config = require("config")
        local expected_auth = config.expected_auth
        local disable_reject_log = config.disable_reject_log
        local enable_whitelist = config.enable_whitelist
        local proxy_domain = config.proxy_domain
        local fallback_backend = config.fallback_backend
        local blacklist = require("blacklist")

        -- 识别代理行为：如果是 CONNECT 请求，或携带了代理认证请求头
        if method == "CONNECT" or proxy_auth ~= nil then
            local client_ip = ngx.var.remote_addr

            -- ============================================================
            -- ① [模式 1：主动式认证] 携带凭证且密码正确 → 直接建隧道
            -- 双模式核心：正确密码本身就是通行证，无视 IP 白名单与黑名单。
            -- curl / Clash / Safari 等主动式客户端首包带密即通，换网络零 TOTP 漫游。
            -- ============================================================
            if proxy_auth == expected_auth then
                local target = ngx.var.http_host or ngx.var.request_uri or "未知目标"
                ngx.log(ngx.NOTICE, "🟢 [PASS] [PROXY_GRANTED] -> 认证成功！为 IP: ", client_ip, " 建立加密盲隧道，目标地址: ", target)
                ngx.exec("@native_tunnel")
                return
            end

            -- ============================================================
            -- ② [错密减速带] 携带凭证但密码错误 → 计数 + 达阈值拉黑 + 回落
            -- 仅对「正在猜密码」的请求计数（按真实 TCP 源 IP，不采信 XFF，防伪造栽赃）。
            -- 已在黑名单内的 IP 不再重复计数。
            -- ============================================================
            if proxy_auth ~= nil then
                local just_blacklisted = blacklist.record_failure(client_ip)
                local reason = "代理凭证错误 (不正确的 Proxy-Authorization 密码)"
                if just_blacklisted then
                    reason = reason .. " —— 错密达到阈值，已拉黑"
                end
                ngx.log(ngx.WARN, "⚠️ [BLOCK] [CREDENTIALS_MISMATCH] -> 代理域名 🌐 [", proxy_domain, "] 拦截凭证错误请求，IP: ", client_ip, " 提供了错误的代理账号密码。动作：降维回落 🔄 [", fallback_backend, "]")

                if disable_reject_log ~= "true" then
                    local tasks = require("tasks")
                    tasks.write_and_trim_rejected_log(client_ip, reason)
                end

                ngx.exec("@backend")
                return
            end

            -- ============================================================
            -- ③ [无凭证路径] 浏览器冷启动 / 扫描器探测
            --    a. IP 在黑名单内 → 回落（黑名单只拦无凭证/错密，正确密码在 ① 已放行）
            --    b. IP 已加白 → 定向 407（浏览器插件 onAuthRequired 填密的唯一触发口）
            --    c. IP 未加白 → 静默回落（绝不 407，防探测；不计数、不入黑名单）
            -- ============================================================
            if blacklist.check(client_ip) then
                ngx.log(ngx.WARN, "🟤 [BLOCK] [BLACKLISTED_NO_AUTH] -> 代理域名 🌐 [", proxy_domain, "] 黑名单内 IP: ", client_ip, " 发起无凭证 CONNECT。动作：拒绝服务，降维回落 🔄 [", fallback_backend, "]")
                ngx.exec("@backend")
                return
            end

            if enable_whitelist == "true" then
                local whitelist = require("whitelist")

                -- 仅信任 Nginx real_ip 已还原的 remote_addr；绝不采信客户端可伪造的 XFF（防伪造栽赃蹭 407）
                local is_allowed = whitelist.check(client_ip)

                if is_allowed then
                    -- 💡 [定向 407 挑战机制]
                    -- Chromium 网络栈本身支持预认证：HttpAuthCache 命中后，第一个 CONNECT 就会带
                    -- Proxy-Authorization，407 不是引擎硬前置，也不是 HTTPS 代理的协议要求。
                    -- 但 Chrome 产品层故意不用代理 URL / chrome.proxy / 系统设置里的嵌入账密；
                    -- SwitchyOmega / ZeroOmega 只能走 webRequest.onAuthRequired，且：
                    --   1) 扩展改不到发往代理的 CONNECT 请求（事件绑定的是目标站 URL）；
                    --   2) Proxy-Authorization 与所有 Proxy-* 都是禁改标头，无法首包注入；
                    --   3) 没有 407 就不会触发 onAuthRequired，锁图标里的密码送不出去。
                    -- 因此对 Chrome 插件冷启动，已加白 IP 仍需回一次 407；主动带密的客户端
                    -- 在 ① 已直接放行，不走这条分支。未加白 IP 绝不回 407，避免把代理指纹
                    -- 暴露给扫描器（它们只能看到回落后端）。
                    ngx.log(ngx.NOTICE, "🔑 [CHALLENGE] -> 已加白 IP: ", client_ip, " 发起 CONNECT 但未带凭证，对其返回 407 定向挑战以触发浏览器自动填充。")
                    ngx.header["Proxy-Authenticate"] = "Basic realm=\"RestyTunnel Secure Proxy\""
                    ngx.status = 407
                    ngx.say("Proxy Authentication Required")
                    ngx.exit(407)
                    return
                end

                local reason = "IP 未加入白名单 (未进行白名单加密授权)"
                ngx.log(ngx.WARN, "🔴 [BLOCK] [IP_NOT_IN_WHITELIST] -> 代理域名 🌐 [", proxy_domain, "] 拦截未授权 IP: ", client_ip, " 试图发起代理。动作：安全洗白，直接降维回落 🔄 [", fallback_backend, "]")

                -- 将未授权记录追加写入内存日志中 (如果未禁用)
                if disable_reject_log ~= "true" then
                    local tasks = require("tasks")
                    tasks.write_and_trim_rejected_log(client_ip, reason)
                end

                -- 直接丢给回落后端处理，由后端（如 Bing 或是网盘）自己处理非标代理请求（通常自然返回 405 Method Not Allowed/400 完美伪装）
                ngx.exec("@backend")
                return
            end

            -- 白名单未开启：无凭证一律静默回落（终极 Stealth 防主动探测）
            local reason = "未带代理凭证（终极 Stealth 全隐形防主动探测机制，直接降维混淆）"
            ngx.log(ngx.WARN, "⚠️ [STEALTH] [PROBE_DETECTED] -> 代理域名 🌐 [", proxy_domain, "] 拦截无凭证 CONNECT 请求。策略：绝不回 407 弹窗，直接降维回落 🔄 [", fallback_backend, "]")

            ngx.exec("@backend")
            return
        end

        -- 普通网民访问，直接转发给后端
        ngx.exec("@backend")
    }
}

