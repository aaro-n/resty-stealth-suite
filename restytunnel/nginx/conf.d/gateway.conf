# 统一入口：安全过滤与代理检测分流 (Security & Proxy Gateway)
location / {
    access_by_lua_block {
        local headers = ngx.req.get_headers()
        local proxy_auth = headers["Proxy-Authorization"]
        local method = ngx.req.get_method()

        -- 🚀 [极致性能优化] 引入 config 高速缓存字典，彻底消除每请求 getenv 与 base64 编解码损耗，将鉴权 CPU 消耗压至极小值！
        local config = require("config")
        local expected_auth = config.expected_auth
        local disable_reject_log = config.disable_reject_log
        local enable_whitelist = config.enable_whitelist
        local proxy_domain = config.proxy_domain
        local fallback_backend = config.fallback_backend

        -- 识别代理行为：如果是 CONNECT 请求，或携带了代理认证请求头
        if method == "CONNECT" or proxy_auth ~= nil then
            -- [IP 来源白名单校验（由 ENABLE_IP_WHITELIST 控制开启）]
            if enable_whitelist == "true" then
                local whitelist = require("whitelist")
                local client_ip = ngx.var.remote_addr
                
                -- 支持从 X-Forwarded-For 中交叉提取真实 IP 进行校验
                local is_allowed = whitelist.check(client_ip)
                if not is_allowed then
                    local xff = headers["X-Forwarded-For"]
                    if xff then
                        if type(xff) == "table" then xff = xff[1] end
                        local xff_ip = string.match(xff, "^%s*([^,]+)")
                        if xff_ip and whitelist.check(xff_ip) then
                            is_allowed = true
                            client_ip = xff_ip
                        end
                    end
                end

                if not is_allowed then
                    local reason = "IP 未加入白名单 (未进行白名单加密授权)"
                    ngx.log(ngx.WARN, "🔴 [BLOCK] [IP_NOT_IN_WHITELIST] -> 代理域名 🌐 [", proxy_domain, "] 拦截未授权 IP: ", client_ip, " 试图发起代理。动作：安全洗白，直接降维回落 🔄 [", fallback_backend, "]")
                    
                    -- 将未授权记录追加写入内存日志中 (如果未禁用)
                    if disable_reject_log ~= "true" then
                        -- 🎯 [流式精密控行] 调用任务处理器，自动顶端插入并裁剪，以行数为绝对基准
                        local tasks = require("tasks")
                        tasks.write_and_trim_rejected_log(client_ip, reason)
                    end

                    -- 直接丢给回落后端处理，由后端（如 Bing 或是网盘）自己处理非标代理请求（通常自然返回 405 Method Not Allowed/400 完美伪装）
                    ngx.exec("@backend")
                    return
                end
            end

            -- 🎯 [终极 Stealth 安全防线]
            -- 即使启用了 IP 白名单且当前 IP 处于已加白状态，为了防御共享 IP (如公共 Wi-Fi、办公室、基站) 下
            -- 其他恶意设备的主动探测，或者普通网民访问时弹出 407 登录框导致特征暴露：
            -- 无论白名单开启与否，只要客户端未提供代理凭证，一律绝不回传 407 挑战，
            -- 直接静默降维反代至回落伪装后端！
            if proxy_auth == nil then
                -- 💡 [定向 407 挑战机制]
                -- 为了完美支持 Chrome/Edge/Firefox 等标准浏览器下的 SwitchyOmega 插件：
                -- 标准浏览器在连接 HTTPS 代理时，第一个 CONNECT 请求绝对不会主动带上 Proxy-Authorization 凭证。
                -- 它们必须收到 407 Proxy Authentication Required 挑战后，才会自动附带保存的密码。
                -- 为了既保持防探测的 Stealth 特性，又完美兼容标准浏览器：
                -- 只有当客户端 IP 处于“已授权白名单”内时，我们才对其返回 407 挑战。
                -- 这样，外部未授权的扫描器/探测器依然看不见任何 407（只能看到回落后端），
                -- 而已加白的用户则能完美、自动地通过 SwitchyOmega 完成密码验证并直通。
                if enable_whitelist == "true" then
                    ngx.log(ngx.NOTICE, "🔑 [CHALLENGE] -> 已加白 IP: ", ngx.var.remote_addr, " 发起 CONNECT 但未带凭证，对其返回 407 定向挑战以触发浏览器自动填充。")
                    ngx.header["Proxy-Authenticate"] = "Basic realm=\"RestyTunnel Secure Proxy\""
                    ngx.status = 407
                    ngx.say("Proxy Authentication Required")
                    ngx.exit(407)
                    return
                end

                local reason = "未带代理凭证（终极 Stealth 全隐形防主动探测机制，直接降维混淆）"
                ngx.log(ngx.WARN, "⚠️ [STEALTH] [PROBE_DETECTED] -> 代理域名 🌐 [", proxy_domain, "] 拦截无凭证 CONNECT 请求。策略：绝不回 407 弹窗，直接降维回落 🔄 [", fallback_backend, "]")
                
                ngx.exec("@backend")
                return
            end

            -- 2. [代理通道的鉴权分流]
            if proxy_auth == expected_auth then
                -- [认证成功]: 跳转至原生盲转暗道
                local target = ngx.var.http_host or ngx.var.request_uri or "未知目标"
                ngx.log(ngx.NOTICE, "🟢 [PASS] [PROXY_GRANTED] -> 认证成功！为 IP: ", ngx.var.remote_addr, " 建立加密盲隧道，目标地址: ", target)
                ngx.exec("@native_tunnel")
                return
            else
                -- [凭证错误或主动探测钓鱼]: 直接扔给后端
                local reason = "代理凭证错误 (不正确的 Proxy-Authorization 密码)"
                ngx.log(ngx.WARN, "⚠️ [BLOCK] [CREDENTIALS_MISMATCH] -> 代理域名 🌐 [", proxy_domain, "] 拦截凭证错误请求，IP: ", ngx.var.remote_addr, " 提供了错误的代理账号密码。动作：降维回落 🔄 [", fallback_backend, "]")
                
                if disable_reject_log ~= "true" then
                    -- 🎯 [流式精密控行] 调用任务处理器，自动顶端插入并裁剪，以行数为绝对基准
                    local tasks = require("tasks")
                    tasks.write_and_trim_rejected_log(ngx.var.remote_addr, reason)
                end

                ngx.exec("@backend")
                return
            end
        end

        -- 普通网民访问，直接转发给后端
        ngx.exec("@backend")
    }
}

