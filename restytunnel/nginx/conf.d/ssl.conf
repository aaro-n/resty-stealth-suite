# ==========================================
# SSL 证书配置（指向外部 /etc/nginx/ssl 映射目录）
# ==========================================
ssl_certificate       /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key   /etc/nginx/ssl/privkey.pem;

# 极致加密安全，抹除弱密码指纹，只保留最现代最安全的 TLS 1.3
ssl_protocols TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers off;

# 🎯 [极致性能调优] 开启并大幅增加 SSL/TLS 共享会话缓存与 Session Ticket
# 这样浏览器在建立多条并发 HTTP/1.1 代理管道时，可以实现零开销的 0-RTT/1-RTT 会话恢复，彻底消灭 TLS 重复握手时延！
ssl_session_cache shared:SSL:30m; # 🚀 提升共享缓存大小至 30MB，可容纳约 12 万个活跃 Session
ssl_session_timeout 4h;           # 🚀 延长会话超时为 4 小时
ssl_session_tickets on;           # 🚀 强开会话 Tickts 支持，允许无状态快速握手恢复

# 开启 TLS 1.3 0-RTT (Early Data)，能显著减少重复客户端的握手时延
ssl_early_data on;
proxy_set_header Early-Data $ssl_early_data;

# ==========================================
# 🎯 [高级优化] 启用 CRL 或证书吊销状态校验 (防指纹探测重要特征防护)
# ==========================================
# 由于 Let's Encrypt 等各大证书颁发机构自 2024 年末起已正式停止并关闭了 OCSP 服务，
# 转型为性能更高、更保护隐私的 CRL (证书吊销列表) 机制，因此在此保持 OCSP 处于完全关闭状态，
# 从而彻底消除了向外部 CA 频繁发起 OCSP 请求造成的物理定位泄露及 Nginx 启动 Ignored 警告。
ssl_stapling off;
ssl_stapling_verify off;

