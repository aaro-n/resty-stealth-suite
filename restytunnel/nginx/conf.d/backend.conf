# 独立的后端服务与伪装网站分流模块 (Backend Module)
location @backend {
    # 🎯 高保真七层反向代理：
    # 将流量无缝、原汁原味地直接转发给后端的真实 VPS 网站/网页网盘等工具。
    # 任何探测或普通请求都会获得该后端网站提供的高真交互或原生错误页面，做到 100% 完美伪装！
    proxy_pass $fallback_backend;
    proxy_set_header Host $fallback_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 完美承载网盘工具中高频使用的 WebSocket / SSE 异步实时连接
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 安全传递 SNI 头，防止反代 HTTPS 后端时因缺失 SNI 导致 502 握手失败
    proxy_ssl_name $fallback_host;
    proxy_ssl_server_name on;

    # 参数调优防止大流量反代传输中断
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;

    # 🎯 [大文件传输优化] 增大代理缓冲区
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}
